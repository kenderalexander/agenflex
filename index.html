<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agendamento Web</title>
  <!-- SDK Oficial do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Fonte Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Variáveis de Tema (Light por Padrão) */
    :root {
      --bg-color: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #64748B;
      --border-color: #E2E8F0;
      --item-hover: #94A3B8;
      --primary: #0066FF;
      --primary-bg: #EFF6FF;
      --summary-bg: #EFF6FF;
      --summary-border: #BFDBFE;
      --summary-text: #1E40AF;
      --shadow: rgba(0, 0, 0, 0.03);
    }

    /* Tema Escuro (Ativado via Classe ou Configuração do Sistema) */
    [data-theme="dark"] {
      --bg-color: #0F172A;
      --card-bg: #1E293B;
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --border-color: #334155;
      --item-hover: #475569;
      --primary: #3B82F6;
      --primary-bg: #1E3A8A;
      --summary-bg: #172554;
      --summary-border: #1E40AF;
      --summary-text: #93C5FD;
      --shadow: rgba(0, 0, 0, 0.2);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    }

    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      display: flex; 
      justify-content: center; 
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    .mobile-card { 
      width: 100%; 
      max-width: 480px; 
      min-height: 100vh; 
      background: var(--bg-color); 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
      position: relative;
    }

    /* Topo com Botão de Tema */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 4px var(--shadow);
      transition: all 0.2s;
    }

    /* Cabeçalho */
    .header { 
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 4px 6px -1px var(--shadow);
      border: 1px solid var(--border-color);
    }
    .header h1 { 
      font-size: 1.25rem; 
      font-weight: 700;
      color: var(--text-main); 
    }
    .header p { 
      font-size: 0.85rem; 
      color: var(--text-sub); 
      margin-top: 4px; 
    }

    /* Barra de Progresso (4 passos) */
    .step-indicator {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .step-dot {
      flex: 1;
      height: 4px;
      background: var(--border-color);
      border-radius: 2px;
      margin: 0 3px;
      transition: background 0.3s;
    }
    .step-dot.active {
      background: var(--primary);
    }

    /* Container de cada Etapa */
    .step-page {
      display: none;
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.3s ease-in-out;
    }
    .step-page.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-group {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 6px -1px var(--shadow);
      border: 1px solid var(--border-color);
    }

    .section-title { 
      font-size: 1rem; 
      font-weight: 700; 
      color: var(--text-main); 
      margin-bottom: 14px; 
    }

    /* Items Selecionáveis */
    .item-card { 
      border: 1.5px solid var(--border-color); 
      border-radius: 12px; 
      padding: 14px; 
      margin-bottom: 10px; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      background: var(--card-bg);
    }
    .item-card:last-child { margin-bottom: 0; }
    .item-card.selected { 
      border-color: var(--primary); 
      background-color: var(--primary-bg); 
      box-shadow: 0 0 0 1px var(--primary);
    }
    .item-title { font-weight: 600; font-size: 0.95rem; color: var(--text-main); }
    .item-sub { font-size: 0.85rem; color: var(--text-sub); margin-top: 4px; }

    /* Grade de Horários */
    .time-grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 8px; 
      margin-top: 10px; 
    }
    .time-slot { 
      border: 1.5px solid var(--border-color); 
      padding: 12px 4px; 
      border-radius: 10px; 
      text-align: center; 
      cursor: pointer; 
      font-size: 0.875rem; 
      font-weight: 600;
      color: var(--text-main);
      background: var(--card-bg);
      transition: all 0.2s ease; 
    }
    .time-slot.selected { 
      background: var(--primary); 
      color: #FFFFFF; 
      border-color: var(--primary); 
      box-shadow: 0 4px 12px rgba(0, 102, 255, 0.25);
    }

    /* Inputs */
    .input-field { 
      width: 100%; 
      padding: 14px; 
      border: 1.5px solid var(--border-color); 
      border-radius: 12px; 
      margin-bottom: 12px; 
      font-size: 0.95rem; 
      outline: none;
      background: var(--card-bg);
      color: var(--text-main);
    }
    .input-field:focus { border-color: var(--primary); }

    /* Botões de Navegação */
    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-top: auto;
      padding-top: 10px;
    }

    .btn { 
      background: var(--primary); 
      color: #FFFFFF; 
      border: none; 
      padding: 16px; 
      border-radius: 14px; 
      font-weight: 600; 
      font-size: 1rem; 
      width: 100%; 
      cursor: pointer; 
      box-shadow: 0 4px 12px rgba(0, 102, 255, 0.2);
      transition: all 0.2s;
    }
    .btn:active { filter: brightness(0.9); }
    .btn-secondary {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1.5px solid var(--border-color);
      box-shadow: none;
      width: 35%;
    }

    #loading { 
      text-align: center; 
      padding: 60px 20px; 
      color: var(--text-sub); 
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="mobile-card">
    <div id="loading">Carregando estabelecimento...</div>

    <div id="app" style="display: none; flex-direction: column; height: 100%; gap: 12px;">
      
      <!-- Topo com Alternador de Tema -->
      <div class="top-bar">
        <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-sub);">AGENDAMENTO WEB</div>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn">
          🌙 Escuro
        </button>
      </div>

      <!-- Cabeçalho da Empresa -->
      <div class="header">
        <h1 id="tenant-name">...</h1>
        <p id="tenant-info"></p>
      </div>

      <!-- Barra de Progresso (4 passos) -->
      <div class="step-indicator">
        <div class="step-dot active" id="dot-1"></div>
        <div class="step-dot" id="dot-2"></div>
        <div class="step-dot" id="dot-3"></div>
        <div class="step-dot" id="dot-4"></div>
      </div>

      <!-- PASSO 1: Escolha do Serviço -->
      <div class="step-page active" id="step-1">
        <div class="card-group">
          <div class="section-title">Passo 1: Selecione o Serviço</div>
          <div id="services-list"></div>
        </div>
      </div>

      <!-- PASSO 2: Escolha do Profissional -->
      <div class="step-page" id="step-2">
        <div class="card-group">
          <div class="section-title">Passo 2: Escolha o Profissional</div>
          <div id="collaborators-list"></div>
        </div>
      </div>

      <!-- PASSO 3: Data e Horário -->
      <div class="step-page" id="step-3">
        <div class="card-group">
          <div class="section-title">Passo 3: Escolha Data e Horário</div>
          <input type="date" id="appointment-date" class="input-field" onchange="loadAvailableTimes()">
          <div id="times-container"></div>
        </div>
      </div>

      <!-- PASSO 4: Seus Dados e Confirmação -->
      <div class="step-page" id="step-4">
        <div class="card-group">
          <div class="section-title">Passo 4: Seus Dados</div>
          <input type="text" id="client-name" class="input-field" placeholder="Seu Nome Completo">
          <input type="tel" id="client-phone" class="input-field" placeholder="Seu WhatsApp (Ex: 11999999999)" style="margin-bottom: 0;">
        </div>
        
        <!-- Resumo do Agendamento -->
        <div class="card-group" style="background: var(--summary-bg); border-color: var(--summary-border);">
          <div style="font-size:0.85rem; color: var(--summary-text); line-height: 1.5;" id="summary-box"></div>
        </div>
      </div>

      <!-- Botões de Navegação Inferiores -->
      <div class="nav-buttons">
        <button id="btn-voltar" class="btn btn-secondary" onclick="changeStep(-1)" style="display: none;">Voltar</button>
        <button id="btn-proximo" class="btn" onclick="changeStep(1)">Avançar</button>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://oxusmmhkpesuubyyyyhx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FVx2K9soCfJ_hczEuGRsOg_jjbqt4ds';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentStep = 1;
    let currentTenant = null;
    let allCollaborators = [];
    let selectedService = null;
    let selectedCollaborator = null;
    let selectedTime = null;

    // Gerenciamento de Tema (Claro/Escuro)
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('theme-btn').innerText = '☀️ Claro';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('theme-btn').innerText = '🌙 Escuro';
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        document.getElementById('theme-btn').innerText = '🌙 Escuro';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        document.getElementById('theme-btn').innerText = '☀️️ Claro';
      }
    }

    function getSlugFromUrl() {
      const path = window.location.pathname.replace(/^\/|\/$/g, '');
      return path || 'kender';
    }

    async function init() {
      initTheme();
      const slug = getSlugFromUrl();
      const { data: tenants, error: tErr } = await _supabase.from('tenants').select('*').eq('slug', slug).single();

      if (tErr || !tenants) {
        document.getElementById('loading').innerText = 'Empresa não encontrada ou link inválido.';
        return;
      }

      currentTenant = tenants;
      document.getElementById('tenant-name').innerText = currentTenant.name;
      
      let infoText = '';
      if (currentTenant.address) infoText += '📍 ' + currentTenant.address;
      if (currentTenant.phone) infoText += (infoText ? '  •  ' : '') + '📞 ' + currentTenant.phone;
      document.getElementById('tenant-info').innerText = infoText;

      const { data: services } = await _supabase.from('services').select('*').eq('tenant_id', currentTenant.id);
      const { data: collaborators } = await _supabase.from('collaborators').select('*').eq('tenant_id', currentTenant.id);

      allCollaborators = collaborators || [];

      renderServices(services || []);
      renderCollaborators(allCollaborators);

      const today = new Date().toISOString().split('T')[0];
      document.getElementById('appointment-date').value = today;
      document.getElementById('appointment-date').min = today;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
    }

    function renderServices(services) {
      const container = document.getElementById('services-list');
      if (services.length === 0) {
        container.innerHTML = '<p style="font-size:0.85rem; color:var(--text-sub);">Nenhum serviço disponível.</p>';
        return;
      }
      container.innerHTML = services.map(s => `
        <div class="item-card" onclick="selectService('${s.id}', '${s.name}', ${s.price}, this)">
          <div class="item-title">${s.name}</div>
          <div class="item-sub">R$ ${Number(s.price).toFixed(2)} • ${s.duration} min</div>
        </div>
      `).join('');
    }

    function renderCollaborators(collaborators) {
      const container = document.getElementById('collaborators-list');
      
      let html = `
        <div class="item-card selected" onclick="selectCollaborator(null, 'Tanto faz / Qualquer Profissional', this)">
          <div class="item-title">✨ Tanto faz / Qualquer um</div>
          <div class="item-sub">O sistema escolherá o profissional disponível</div>
        </div>
      `;

      if (collaborators.length > 0) {
        html += collaborators.map(c => `
          <div class="item-card" onclick="selectCollaborator('${c.id}', '${c.name}', this)">
            <div class="item-title">👤 ${c.name}</div>
          </div>
        `).join('');
      }

      container.innerHTML = html;
      selectedCollaborator = { id: null, name: 'Tanto faz / Qualquer Profissional' };
    }

    function selectService(id, name, price, el) {
      document.querySelectorAll('#services-list .item-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedService = { id, name, price };
    }

    function selectCollaborator(id, name, el) {
      document.querySelectorAll('#collaborators-list .item-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedCollaborator = { id, name };
      loadAvailableTimes();
    }

    function loadAvailableTimes() {
      const container = document.getElementById('times-container');
      const defaultTimes = ['08:00', '09:00', '10:00', '11:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00'];

      container.innerHTML = `
        <div class="time-grid">
          ${defaultTimes.map(t => `<div class="time-slot" onclick="selectTime('${t}', this)">${t}</div>`).join('')}
        </div>
      `;
    }

    function selectTime(time, el) {
      document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
      selectedTime = time;
    }

    function changeStep(direction) {
      if (direction === 1) {
        if (currentStep === 1 && !selectedService) {
          alert('Por favor, selecione um serviço para avançar.');
          return;
        }
        if (currentStep === 2 && !selectedCollaborator) {
          alert('Por favor, selecione um profissional ou a opção "Tanto faz".');
          return;
        }
        if (currentStep === 3) {
          if (!selectedTime) {
            alert('Por favor, selecione um horário para avançar.');
            return;
          }
          updateSummary();
        }
        if (currentStep === 4) {
          finalizarAgendamento();
          return;
        }
      }

      currentStep += direction;
      if (currentStep < 1) currentStep = 1;
      if (currentStep > 4) currentStep = 4;

      updateUI();
    }

    function updateUI() {
      document.querySelectorAll('.step-page').forEach((page, idx) => {
        page.classList.toggle('active', idx + 1 === currentStep);
      });

      document.querySelectorAll('.step-step-dot').forEach((dot, idx) => {
        dot.classList.toggle('active', idx + 1 <= currentStep);
      });

      const btnVoltar = document.getElementById('btn-voltar');
      const btnProximo = document.getElementById('btn-proximo');

      btnVoltar.style.display = currentStep === 1 ? 'none' : 'block';
      
      if (currentStep === 4) {
        btnProximo.innerText = 'Finalizar Agendamento';
      } else {
        btnProximo.innerText = 'Avançar';
      }

      if (currentStep === 3) {
        loadAvailableTimes();
      }
    }

    function updateSummary() {
      const dateVal = document.getElementById('appointment-date').value;
      const dataFormatada = dateVal.split('-').reverse().join('/');

      document.getElementById('summary-box').innerHTML = `
        <strong>Resumo da Reserva:</strong><br>
        • <strong>Serviço:</strong> ${selectedService.name} (R$ ${Number(selectedService.price).toFixed(2)})<br>
        • <strong>Profissional:</strong> ${selectedCollaborator.name}<br>
        • <strong>Data e Hora:</strong> ${dataFormatada} às ${selectedTime}
      `;
    }

    async function finalizarAgendamento() {
      const name = document.getElementById('client-name').value.trim();
      const phone = document.getElementById('client-phone').value.trim();
      const dateVal = document.getElementById('appointment-date').value;

      if (!name || !phone) {
        alert('Por favor, preencha seu nome e WhatsApp.');
        return;
      }

      const btn = document.getElementById('btn-proximo');
      btn.disabled = true;
      btn.innerText = 'Agendando...';

      try {
        let colabId = selectedCollaborator.id;
        if (!colabId && allCollaborators.length > 0) {
          colabId = allCollaborators[0].id;
        }

        const { data: client, error: cErr } = await _supabase
          .from('clients')
          .insert([{ tenant_id: currentTenant.id, name, phone }])
          .select().single();

        if (cErr) throw cErr;

        const fullDateTime = `${dateVal}T${selectedTime}:00`;
        const { error: aErr } = await _supabase
          .from('appointments')
          .insert([{
            tenant_id: currentTenant.id,
            client_id: client.id,
            service_id: selectedService.id,
            collaborator_id: colabId,
            appointment_date: fullDateTime,
            status: 'pendente',
            price: selectedService.price
          }]);

        if (aErr) throw aErr;

        alert('Sua reserva está em análise. Em breve você receberá uma notificação no seu WhatsApp com a confirmação ou sugestão de horário da empresa.');
        location.reload();

      } catch (err) {
        alert('Erro ao agendar: ' + err.message);
        btn.disabled = false;
        btn.innerText = 'Finalizar Agendamento';
      }
    }

    window.onload = init;
  </script>
</body>
</html>
